name: Vendor privacy assets

on:
  workflow_dispatch:
  push:
    branches:
      - fix/privacy-compliance
    paths:
      - scripts/fetch-local-assets.mjs
      - .github/workflows/vendor-privacy-assets.yml

permissions:
  contents: write

concurrency:
  group: vendor-privacy-assets
  cancel-in-progress: true

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout compliance branch
        uses: actions/checkout@v4
        with:
          ref: fix/privacy-compliance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download external media and fonts into public assets
        run: node scripts/fetch-local-assets.mjs

      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media public/fonts
          if git diff --cached --quiet; then
            echo "Vendored assets are already up to date."
            exit 0
          fi
          git commit -m "Vendor external media and fonts locally"
          git push origin HEAD:fix/privacy-compliance
